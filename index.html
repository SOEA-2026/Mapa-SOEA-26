<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa</title>

    <style>
        .imagem-container {
            position: relative;
            width: 100%;
            display: inline-block;
        }

        .imagem-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ÁREA EXATA DA ESCRITA */
        .area-piso-superior {
            position: absolute;

            /*
             * POSIÇÃO DA ÁREA
             */
            top: 0;
            right: 0;

            /*
             * LARGURA DA ÁREA DA ESCRITA
             */
            width: 23%;

            /*
             * ALTURA DA ÁREA DA ESCRITA
             */
            height: 100%;

            cursor: pointer;
            z-index: 10;

            background: transparent;
        }
    </style>
</head>

<body>

    <div class="imagem-container">

        <!-- IMAGEM PRINCIPAL -->
        <img
            src="https://github.com/user-attachments/assets/6a7f1b32-05f6-4460-8d60-59c16dff031a"
            alt="Mapa do Centro de Convenções"
        >

        <!-- CLIQUE SOMENTE NA ÁREA DA ESCRITA -->
        <a
            class="area-piso-superior"
            href="https://iili.io/noZcdrP.jpg"
            target="_blank"
            aria-label="Abrir mapa do Piso Superior"
        ></a>

    </div>

</body>

</html>
