<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mapa {
            position: relative;
            width: 100%;
            max-width: 1152px;
        }

        .mapa img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ================================
           BOTÃO - PISO SUPERIOR
           ================================ */

        .botao-piso-superior {
            position: absolute;

            top: 3%;
            left: 17%;
            width: 66%;
            height: 7%;

            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
        }

        /* ================================
           BOTÃO - PISO INFERIOR
           ================================ */

        .botao-piso-inferior {
            position: absolute;

            top: 91%;
            left: 17%;
            width: 66%;
            height: 7%;

            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="mapa">

        <img
            id="mapaImagem"
            src="https://github.com/user-attachments/assets/0ec01ce1-6dcd-4eed-bf46-0508116ac587"
            alt="Mapa"
        >

        <!-- Piso superior -->
        <button
            id="botaoSuperior"
            class="botao-piso-superior"
            onclick="abrirPisoSuperior()"
            aria-label="Clique aqui para o piso superior">
        </button>

        <!-- Piso inferior -->
        <button
            id="botaoInferior"
            class="botao-piso-inferior"
            onclick="abrirPisoInferior()"
            aria-label="Clique aqui para o piso inferior"
            style="display: none;">
        </button>

    </div>

    <script>

        const mapaImagem = document.getElementById("mapaImagem");
        const botaoSuperior = document.getElementById("botaoSuperior");
        const botaoInferior = document.getElementById("botaoInferior");

        // Imagem do piso inferior
        const pisoInferior =
            "https://github.com/user-attachments/assets/0ec01ce1-6dcd-4eed-bf46-0508116ac587";

        // Imagem do piso superior
        const pisoSuperior =
            "https://github.com/user-attachments/assets/52215868-bbbd-4b22-992b-02cf7a856cc6";


        function abrirPisoSuperior() {

            mapaImagem.src = pisoSuperior;

            // Esconde botão do piso superior
            botaoSuperior.style.display = "none";

            // Mostra botão do piso inferior
            botaoInferior.style.display = "block";
        }


        function abrirPisoInferior() {

            mapaImagem.src = pisoInferior;

            // Mostra botão do piso superior
            botaoSuperior.style.display = "block";

            // Esconde botão do piso inferior
            botaoInferior.style.display = "none";
        }

    </script>

</body>

</html>
